<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ESN Compétition</title>
    <meta name="description" content="ESN Compétition — l’application compétition gratuite des nageurs de l’Ecole Seraing Natation : résultats officiels, records, progression, programme des compétitions et objectifs." />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ESN Compétition" />
    <meta name="application-name" content="ESN Compétition" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Application installée (plein écran) ou version web (dans un navigateur) : marge du haut adaptée
      document.documentElement.classList.add(
        matchMedia('(display-mode: standalone)').matches || navigator.standalone === true ? 'pwa' : 'web',
      );
    </script>
    <style>
      html { background: #f4f4f5; }
      /* Écran d'ouverture : le logo du club en couleurs sur fond blanc, le temps que l'application démarre */
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: #ffffff; transition: opacity 0.35s ease; }
      #splash img { width: min(62vw, 280px); height: auto; animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #splash.hide { opacity: 0; pointer-events: none; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
    <!-- Sans JavaScript, l'écran d'ouverture ne serait jamais retiré et cacherait le message ci-dessous -->
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="./brand/esn-competition.png" alt="" /></div>
    <div id="root"></div>
    <noscript>ESN Compétition a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
